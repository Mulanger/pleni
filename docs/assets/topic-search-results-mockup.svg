    <text x="116" y="433" fill="#777a75" font-size="11.5">
      <tspan x="116" dy="0">“…ett rättvist skattesystem som</tspan>
      <tspan x="116" dy="15">finansierar jobb, skola och vård.”</tspan>
    </text>
  </g>
