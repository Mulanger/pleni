<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Pleni search results concept for Magdalena Andersson skatter 2017</title>
  <desc id="desc">A light mobile search page with a search field, party filters, a politician result, relevant parliamentary video clips, and Pleni bottom navigation.</desc>

  <defs>
