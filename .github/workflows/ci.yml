name: CI

# Prerequisite O-1 (BLOCKER) in docs/RECOMMENDATION_PREREQUISITES.md.
#
# Until this existed, every gate in that document was enforced by an agent
# remembering to run `python tasks.py test lint typecheck` before handing off.
# That worked for a while and is not a control.
#
# `live` and `slow` tests stay out of CI: `live` hits real Riksdagen, Bunny and
# Supabase, and `slow` renders video. Both are run by hand and recorded in
# PROGRESS.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Pipeline (test, lint, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # pyproject requires >=3.11. Pinned rather than "3.x" so a new
          # release cannot change what CI means without a commit.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system libraries for OpenCV
        # opencv-python links against libGL/libgthread, which the GitHub runner
        # image does not ship. Without these, `import cv2` fails at C8/C9.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install
        # The full pinned tree, including the torch stack whisperx pulls in.
        # Slow on a cold cache; installing a slimmer set would mean CI is not
        # testing what production runs.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Acceptance
        run: python tasks.py test lint typecheck

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: node ./node_modules/typescript/bin/tsc --noEmit -p tsconfig.json

      - name: Build
        # No VITE_* secrets are provided on purpose: the build must succeed
        # without Clerk or Supabase configured, which is the same degraded path
        # a bad deploy would hit (ADR 006).
        run: node ./node_modules/vite/bin/vite.js build

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No committed environment files
        # `.env` and `.env.*` are gitignored, but a `git add -f` would slip
        # through review. `.env.example` is the one allowed exception.
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "Environment files must never be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: No secrets in VITE_ variables
        # A server secret behind a VITE_ prefix ships to every browser. This
        # catches the rename, not the value (Appendix A).
        run: |
          hits=$(grep -rnE 'VITE_[A-Z_]*(SECRET|SERVICE_ROLE|ACCESS_TOKEN|API_KEY)' \
            --include='*.ts' --include='*.tsx' --include='*.toml' \
            --include='*.example' --include='*.yml' . || true)
          if [ -n "$hits" ]; then
            echo "A secret-looking name is exposed through a VITE_ variable:"
            echo "$hits"
            exit 1
          fi

      - name: Every up migration has a down migration
        run: |
          for up in migrations/*.up.sql; do
            down="${up%.up.sql}.down.sql"
            if [ ! -f "$down" ]; then
              echo "Missing $down"
              exit 1
            fi
          done
