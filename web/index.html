<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050608" />
    <meta name="application-name" content="Pleni" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Pleni" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon-20260812b.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-20260812b.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-20260812b.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/pleni-apple-touch-icon-20260812b.png"
    />

    <!--
      SEO0. `pleni.se`, `www.pleni.se` and the InstaPods pod hostname all serve
      this document byte-for-byte with no redirect between them, so the absolute
      canonical below is what stops the three from competing as duplicates.
      Do not make it relative.

      Watch and hub pages generated by SEO2/SEO3 write their own canonical,
      title, description and structured data. This file's values describe the
      home feed only.
    -->
    <title>Pleni — riksdagsdebatter som korta klipp</title>
    <meta
      name="description"
      content="Svenska riksdagsdebatter som korta klipp. Varje klipp visar talare, parti och debatt — med länk till originalet hos Riksdagen."
    />
    <link rel="canonical" href="https://pleni.se/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pleni" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:url" content="https://pleni.se/" />
    <meta property="og:title" content="Pleni — riksdagsdebatter som korta klipp" />
    <meta
      property="og:description"
      content="Svenska riksdagsdebatter som korta klipp. Varje klipp visar talare, parti och debatt — med länk till originalet hos Riksdagen."
    />
    <meta property="og:image" content="https://pleni.se/brand/pleni-logo-edge-20260812.png" />
    <meta property="og:image:width" content="1254" />
    <meta property="og:image:height" content="1254" />
    <meta property="og:image:alt" content="Plenis logotyp" />

    <!-- The brand mark is square, so `summary` is the honest card here. Watch
         pages use a player card with the clip's own vertical thumbnail. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Pleni — riksdagsdebatter som korta klipp" />
    <meta
      name="twitter:description"
      content="Svenska riksdagsdebatter som korta klipp. Varje klipp visar talare, parti och debatt — med länk till originalet hos Riksdagen."
    />
    <meta name="twitter:image" content="https://pleni.se/brand/pleni-logo-edge-20260812.png" />

    <!--
      No `SearchAction` / sitelinks searchbox is declared. Pleni's search
      deliberately keeps the query text in React memory and out of the URL
      (`web/src/search/route.ts`), so there is no query-string endpoint to point
      a searchbox at. Declaring one that does not resolve is worse than none.
      See docs/adr/014-prerendered-seo-surface.md.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://pleni.se/#organization",
            "name": "Pleni",
            "url": "https://pleni.se/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://pleni.se/brand/pleni-logo-edge-20260812.png",
              "width": 1254,
              "height": 1254
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://pleni.se/#website",
            "name": "Pleni",
            "url": "https://pleni.se/",
            "inLanguage": "sv-SE",
            "publisher": { "@id": "https://pleni.se/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
